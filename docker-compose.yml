services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./models:/repo/models
    restart: unless-stopped

  frontend:
    image: python:3.11-slim
    working_dir: /site
    volumes:
      - ./frontend:/site
    command: ["python", "-m", "http.server", "3000"]
    ports:
      - "3000:3000"
    depends_on:
      - backend
